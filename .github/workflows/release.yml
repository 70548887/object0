name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing the updater implementation
        required: true
        type: string
      signed_updates:
        description: Publish signed online-update assets (requires dedicated public variable and private secrets)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == '70548887/object0'
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      YUNCANG_BUILD_KIND: 'release'
      YUNCANG_UPDATER_PUBLIC_KEY: ${{ inputs.signed_updates && vars.YUNCANG_UPDATER_PUBLIC_KEY || '' }}
      SIGNED_UPDATES: ${{ inputs.signed_updates }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate requested tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a version tag such as v1.7.0 or v1.7.0-preview.1.'
          }

      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify source release version
        run: |
          $expected = $env:RELEASE_TAG.Substring(1)
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the exact release commit.' }
          "YUNCANG_BUILD_HASH=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne $expected -or $tauri.version -ne $expected) {
            throw 'Tag, package.json and Tauri versions must match before building.'
          }
          if ($tauri.bundle.createUpdaterArtifacts) { throw 'Unsigned local releases must not generate upstream updater artifacts.' }
          if (@($tauri.plugins.updater.endpoints).Count -ne 0) { throw 'The fork must not inherit an upstream update feed.' }
          if ($env:SIGNED_UPDATES -eq 'true' -and [string]::IsNullOrWhiteSpace($env:YUNCANG_UPDATER_PUBLIC_KEY)) {
            throw 'Configure the dedicated YUNCANG_UPDATER_PUBLIC_KEY repository variable before building signed updates.'
          }
          if ($env:SIGNED_UPDATES -eq 'true') {
            $helper = 'src-tauri/src/portable_update.rs'
            if (-not (Test-Path -LiteralPath $helper) -or -not (Select-String -LiteralPath $helper -SimpleMatch '--yuncang-verify-update-file' -Quiet)) {
              throw 'The selected tag predates signed updater support; do not run an old GUI executable as a validator.'
            }
          }

      - name: Fetch pinned Microsoft WebView2 fixed runtime
        run: |
          $metadata = Get-Content packaging/windows-runtime.json -Raw | ConvertFrom-Json
          if ($metadata.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Missing pinned runtime SHA256.' }
          $url = [uri]$metadata.url
          if ($url.Scheme -ne 'https' -or $url.Host -notmatch '(^|\.)microsoft\.com$') {
            throw 'Runtime must come from an official Microsoft HTTPS endpoint.'
          }
          $downloads = Join-Path $env:RUNNER_TEMP 'object0-webview2-download'
          $expanded = Join-Path $downloads 'expanded'
          New-Item -ItemType Directory -Path $expanded -Force | Out-Null
          $cab = Join-Path $downloads 'WebView2Runtime.cab'
          Invoke-WebRequest -Uri $url -OutFile $cab
          if ((Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash -ne $metadata.sha256) { throw 'Runtime CAB checksum mismatch.' }
          & expand.exe '-F:*' $cab $expanded
          if ($LASTEXITCODE -ne 0) { throw 'Runtime CAB extraction failed.' }
          $executables = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter msedgewebview2.exe)
          if ($executables.Count -ne 1) { throw 'Expected one fixed runtime executable.' }
          $signature = Get-AuthenticodeSignature -FilePath $executables[0].FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'The fixed runtime does not have a valid Microsoft signature.'
          }
          if ($executables[0].VersionInfo.ProductVersion -ne $metadata.version) { throw 'Runtime version mismatch.' }
          $runtimeRoot = Split-Path -Parent $executables[0].FullName
          $destination = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/WebView2Runtime'
          if (Test-Path -LiteralPath $destination) { throw 'Runtime destination must not already exist in source.' }
          Copy-Item -LiteralPath $runtimeRoot -Destination $destination -Recurse

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Run local-only regression tests
        run: |
          bun run test:frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend or isolated regression tests failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml --release --lib --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust local-only unit and contract tests failed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tests changed tracked release source.' }

      - name: Build Chinese NSIS installer
        run: |
          bun run tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/WebView2Runtime'
          $runtimeOutput = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/WebView2Runtime'
          if (-not (Test-Path -LiteralPath $runtimeOutput)) {
            Copy-Item -LiteralPath $runtime -Destination $runtimeOutput -Recurse
          }

      - name: Package portable ZIP and checksums
        run: |
          ./scripts/release/package-windows.ps1 -BuildDir ./src-tauri/target -OutputDir ./release-assets

      - name: Sign update packages and manifest, then verify with compiled trust anchor
        if: inputs.signed_updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.YUNCANG_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.YUNCANG_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          ./scripts/release/sign-github-updates.ps1 -AssetsDir ./release-assets -ValidatorExe ./src-tauri/target/release/object0.exe -NotesFile ./docs/PORTABLE_ZH.md

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: object0-windows-${{ inputs.tag }}
          path: |
            release-assets/*_setup.exe
            release-assets/*_portable.zip
            release-assets/SHA256SUMS.txt
            release-assets/*.sig
            release-assets/yuncang-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload, verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $preview = $version.Contains('-')
          $names = @(
            "object0_$($version)_windows_x64_setup.exe",
            "object0_$($version)_windows_x64_portable.zip",
            'SHA256SUMS.txt'
          )
          if ($env:SIGNED_UPDATES -eq 'true') {
            $names += @("object0_$($version)_windows_x64_setup.exe.sig", "object0_$($version)_windows_x64_portable.zip.sig", 'yuncang-update.json', 'yuncang-update.json.sig')
          }
          $files = @($names | ForEach-Object { Join-Path './release-assets' $_ })
          $existing = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite an already published release.' }
          } else {
            $createArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GH_REPO, '--verify-tag', '--draft', '--title', ($env:RELEASE_TAG + ' - 云仓 Windows'), '--generate-notes', '--notes-file', 'docs/PORTABLE_ZH.md')
            if ($preview) { $createArgs += @('--prerelease', '--latest=false') }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release.' }
          }
          gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains a draft. Existing assets were not overwritten.' }
          $verification = Join-Path $env:RUNNER_TEMP ('object0-verify-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verification | Out-Null
          foreach ($name in $names) {
            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern $name --dir $verification
            if ($LASTEXITCODE -ne 0) { throw 'Release asset download verification failed.' }
            $local = Join-Path './release-assets' $name
            $downloaded = Join-Path $verification $name
            if ((Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash) {
              throw 'Uploaded release asset bytes do not match the local package.'
            }
          }
          if ($preview) {
            gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --prerelease --latest=false
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'All assets verified, but release publication failed.' }
